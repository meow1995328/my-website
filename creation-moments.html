<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css?v=20261016c">

    <style>
        .moments-columns {
            columns: 3;
            column-gap: 1.2rem;
            padding: 1rem 0;
        }

        @media (max-width: 900px) {
            .moments-columns { columns: 2; }
        }
        @media (max-width: 600px) {
            .moments-columns { columns: 1; }
        }

        .moment-card {
            break-inside: avoid;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 0.9rem;
            margin-bottom: 1.2rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .moment-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            border-color: rgba(0, 212, 255, 0.35);
        }

        .moment-images {
            display: grid;
            gap: 0.4rem;
            margin-bottom: 0.7rem;
        }
        .moment-images.single { grid-template-columns: 1fr; }
        .moment-images.double { grid-template-columns: 1fr 1fr; }
        .moment-images.triple { grid-template-columns: 1fr 1fr 1fr; }

        .moment-images img,
        .moment-placeholder {
            width: 100%;
            border-radius: 10px;
            display: block;
            object-fit: cover;
        }
        .moment-images.single img,
        .moment-images.single .moment-placeholder { aspect-ratio: 4/3; }
        .moment-images.double img,
        .moment-images.triple img,
        .moment-images.double .moment-placeholder,
        .moment-images.triple .moment-placeholder { aspect-ratio: 1/1; }

        .moment-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .moment-text {
            font-size: 0.92rem;
            line-height: 1.55;
            color: #e0e0e0;
            margin-bottom: 0.6rem;
            white-space: pre-line;
        }

        .moment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }
        .moment-date {
            font-size: 0.75rem;
            color: #888;
        }
        .moment-tags {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .moment-tags span {
            font-size: 0.68rem;
            padding: 0.15rem 0.5rem;
            background: rgba(0, 212, 255, 0.12);
            color: #00d4ff;
            border-radius: 10px;
        }

        /* Modal */
        .moment-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .moment-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .moment-modal-content {
            background: #1a1a2e;
            border-radius: 18px;
            max-width: 560px;
            width: 90%;
            max-height: 88vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .moment-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
        }
        .moment-modal-close:hover { color: #fff; }
        .moment-location {
            font-size: 0.75rem;
            color: #00d4ff;
        }
        .moment-meta-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* 弹窗图片画廊：一次显示一张，可按钮/滑动/方向键切换 */
        .moment-gallery {
            margin-bottom: 1rem;
            text-align: center;
        }
        /* 舞台按图片真实比例收缩包裹：横图铺满宽度，竖图铺满高度，竖图也能显示得很大 */
        .moment-gallery-stage {
            position: relative;
            display: inline-block;
            max-width: 100%;
            line-height: 0;
            background: #0d0d1a;
            border-radius: 12px;
            overflow: hidden;
            touch-action: pan-y;
        }
        .moment-gallery-view img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
            user-select: none;
            -webkit-user-drag: none;
            animation: galleryFade 0.25s ease;
        }
        @keyframes galleryFade {
            from { opacity: 0; transform: scale(0.98); }
            to   { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 600px) {
            .moment-gallery-view img { max-height: 50vh; }
        }
        .moment-gallery-view .moment-placeholder {
            width: min(512px, 100%);
            aspect-ratio: 16 / 10;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
        .moment-gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease;
            z-index: 2;
        }
        .moment-gallery-arrow:hover {
            background: #00d4ff;
            color: #0d0d1a;
        }
        .moment-gallery-arrow.prev { left: 10px; }
        .moment-gallery-arrow.next { right: 10px; }

        .moment-gallery-counter {
            position: absolute;
            right: 10px;
            bottom: 10px;
            padding: 0.18rem 0.55rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            color: #fff;
            font-size: 0.74rem;
            z-index: 2;
        }
        .moment-gallery-dots {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 0.7rem;
        }
        .moment-gallery-dot {
            width: 7px;
            height: 7px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .moment-gallery-dot.active {
            background: #00d4ff;
            transform: scale(1.35);
        }
        .moment-modal-text {
            font-size: 1rem;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 1rem;
            white-space: pre-line;
        }
        .moment-modal-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .moments-filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
        }
        .moments-filter-btn {
            padding: 0.4rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.85rem;
        }
        .moments-filter-btn .filter-count {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 0.05rem 0.4rem;
            font-size: 0.72rem;
            min-width: 1.2rem;
            text-align: center;
        }
        .moments-filter-btn:hover,
        .moments-filter-btn.active {
            background: #00d4ff;
            border-color: #00d4ff;
            color: #0d0d1a;
        }
        .moments-filter-btn:hover .filter-count,
        .moments-filter-btn.active .filter-count {
            background: rgba(13, 13, 26, 0.2);
        }
    </style>

    <script>(function() {

        const moments = [
            {
                id: 'm-20260124',
                images: [
                    { src: 'images/moments/20260124_望京西a.jpg' },
                    { src: 'images/moments/20260124_望京西b.jpg' },
                    { src: 'images/moments/20260124_望京西c.jpg' }
                ],
                text: '建了N年的望京西交通枢纽终于完工了！大气又漂亮！以后大家来找我玩更方便了！😄',
                date: '2026年1月',
                location: '望京西',
                tags: ['📷 日常']
            },
            {
                id: 'm-20260102',
                images: [
                    { src: 'images/moments/20260102_神泉峡a.jpg' },
                    { src: 'images/moments/20260102_神泉峡b.jpg' },
                    { src: 'images/moments/20260102_神泉峡c.jpg' }
                ],
                text: '京西第一冰瀑，它可是人工的哦，一点也不冷呢🤭😏',
                date: '2026年1月',
                location: '神泉峡',
                tags: ['📷 日常']
            },
            {
                id: 'm-1',
                images: [
                    { type: 'placeholder', gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', icon: '📷' }
                ],
                text: '占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字。',
                date: '2026-08-25',
                tags: ['📷 日常']
            },
            {
                id: 'm-2',
                images: [
                    { type: 'placeholder', gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', icon: '📷' },
                    { type: 'placeholder', gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', icon: '📷' }
                ],
                text: '占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字。',
                date: '2026-08-26',
                tags: ['📷 日常']
            },
            {
                id: 'm-3',
                images: [
                    { type: 'placeholder', gradient: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', icon: '🐾' }
                ],
                text: '占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字。',
                date: '2026-08-27',
                tags: ['🐾 萌宠']
            },
            {
                id: 'm-4',
                images: [
                    { type: 'placeholder', gradient: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', icon: '🏆' }
                ],
                text: '占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字占位文字。',
                date: '2026-08-28',
                tags: ['🏆 成就']
            }
        ];

        function getUniqueTags() {
            const set = new Set();
            moments.forEach(m => (m.tags || []).forEach(t => set.add(t)));
            return Array.from(set);
        }

        function renderImageItem(img) {
            if (img.type === 'placeholder') {
                return `<div class="moment-placeholder" style="background: ${img.gradient}">${img.icon || ''}</div>`;
            }
            return `<img src="${img.src}" alt="" loading="lazy">`;
        }

        function renderMoments(category = 'all') {
            const columns = document.getElementById('momentsColumns');
            const filtered = category === 'all'
                ? moments
                : moments.filter(m => (m.tags || []).some(t => t === category));

            columns.innerHTML = filtered.map(m => {
                const count = m.images.length;
                const gridClass = count === 1 ? 'single' : count === 2 ? 'double' : 'triple';
                const imgsHtml = m.images.map(renderImageItem).join('');
                const tagsHtml = (m.tags || []).map(t => `<span>${t}</span>`).join('');

                return `
                    <div class="moment-card" data-id="${m.id}">
                        <div class="moment-images ${gridClass}">${imgsHtml}</div>
                        <div class="moment-text">${m.text}</div>
                        <div class="moment-meta">
                            <div class="moment-meta-info">
                                ${m.location ? `<span class="moment-location">📍 ${m.location}</span>` : ''}
                                <span class="moment-date">${m.date}</span>
                            </div>
                            <div class="moment-tags">${tagsHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');

            columns.querySelectorAll('.moment-card').forEach(card => {
                card.addEventListener('click', () => openMomentModal(card.dataset.id));
            });
        }

        const tagCategories = ['📷 日常', '🐾 萌宠', '✈️ 旅行', '🏆 成就'];

        function countByTag(tag) {
            if (tag === 'all') return moments.length;
            return moments.filter(m => (m.tags || []).some(t => t === tag)).length;
        }

        function renderFilterBar() {
            const bar = document.getElementById('momentsFilterBar');
            tagCategories.forEach(tag => {
                const count = countByTag(tag);
                const btn = document.createElement('button');
                btn.className = 'moments-filter-btn';
                btn.dataset.category = tag;
                btn.innerHTML = `${tag} <span class="filter-count">${count}</span>`;
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('.moments-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderMoments(tag);
                });
                bar.appendChild(btn);
            });

            const allBtn = bar.querySelector('[data-category="all"]');
            if (allBtn) {
                allBtn.innerHTML = `全部 <span class="filter-count">${moments.length}</span>`;
                allBtn.addEventListener('click', () => {
                    bar.querySelectorAll('.moments-filter-btn').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    renderMoments('all');
                });
            }
        }

        let galleryImages = [];
        let galleryIndex = 0;

        function renderGallery(images) {
            galleryImages = images;
            galleryIndex = 0;

            const wrap = document.getElementById('momentModalImages');
            const multiple = images.length > 1;
            wrap.innerHTML = `
                <div class="moment-gallery-stage" id="momentGalleryStage">
                    ${multiple ? '<button class="moment-gallery-arrow prev" type="button" aria-label="上一张">‹</button>' : ''}
                    <div class="moment-gallery-view" id="momentGalleryView"></div>
                    ${multiple ? '<button class="moment-gallery-arrow next" type="button" aria-label="下一张">›</button>' : ''}
                    ${multiple ? '<span class="moment-gallery-counter" id="momentGalleryCounter"></span>' : ''}
                </div>
                ${multiple ? '<div class="moment-gallery-dots" id="momentGalleryDots"></div>' : ''}
            `;

            if (multiple) {
                wrap.querySelector('.moment-gallery-arrow.prev')
                    .addEventListener('click', () => stepGallery(-1));
                wrap.querySelector('.moment-gallery-arrow.next')
                    .addEventListener('click', () => stepGallery(1));

                const stage = document.getElementById('momentGalleryStage');
                let startX = null;
                stage.addEventListener('touchstart', e => {
                    startX = e.changedTouches[0].clientX;
                }, { passive: true });
                stage.addEventListener('touchend', e => {
                    if (startX === null) return;
                    const dx = e.changedTouches[0].clientX - startX;
                    startX = null;
                    if (Math.abs(dx) > 40) stepGallery(dx < 0 ? 1 : -1);
                }, { passive: true });
            }

            updateGallery();
        }

        function updateGallery() {
            document.getElementById('momentGalleryView').innerHTML =
                renderImageItem(galleryImages[galleryIndex]);

            const counter = document.getElementById('momentGalleryCounter');
            if (counter) counter.textContent = `${galleryIndex + 1} / ${galleryImages.length}`;

            const dots = document.getElementById('momentGalleryDots');
            if (dots) {
                dots.innerHTML = galleryImages.map((_, i) =>
                    `<button class="moment-gallery-dot${i === galleryIndex ? ' active' : ''}" type="button" data-index="${i}" aria-label="第 ${i + 1} 张"></button>`
                ).join('');
                dots.querySelectorAll('.moment-gallery-dot').forEach(dot => {
                    dot.addEventListener('click', () => {
                        galleryIndex = Number(dot.dataset.index);
                        updateGallery();
                    });
                });
            }
        }

        function stepGallery(dir) {
            const total = galleryImages.length;
            if (total <= 1) return;
            galleryIndex = (galleryIndex + dir + total) % total;
            updateGallery();
        }

        function openMomentModal(id) {
            const m = moments.find(x => x.id === id);
            if (!m) return;

            renderGallery(m.images);
            document.getElementById('momentModalText').textContent = m.text;
            document.getElementById('momentModalInfo').innerHTML =
                (m.location ? `<span class="moment-location">📍 ${m.location}</span>` : '')
                + `<span class="moment-date">${m.date}</span>`;
            document.getElementById('momentModalTags').innerHTML =
                (m.tags || []).map(t => `<span>${t}</span>`).join('');

            document.getElementById('momentModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMomentModal() {
            document.getElementById('momentModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('momentModalClose').addEventListener('click', closeMomentModal);
        document.getElementById('momentModal').addEventListener('click', function(e) {
            if (e.target === this) closeMomentModal();
        });
        if (window.__momentKeyHandler) {
            document.removeEventListener('keydown', window.__momentKeyHandler);
        }
        window.__momentKeyHandler = function(e) {
            const modal = document.getElementById('momentModal');
            if (!modal || !modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeMomentModal();
            else if (e.key === 'ArrowLeft') stepGallery(-1);
            else if (e.key === 'ArrowRight') stepGallery(1);
        };
        document.addEventListener('keydown', window.__momentKeyHandler);

        renderFilterBar();
        renderMoments();
})();</script>
