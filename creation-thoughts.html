<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随想碎碎念 - 薛大侠</title>
    <link rel="stylesheet" href="css/style.css?v=20261029j">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="js/fuse.min.js"></script>
    <style>
        /* 碎碎念列表（紧凑纵向列表，点击进入页内详情） */
        .thought-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .thought-list[hidden] {
            display: none;
        }
        .thought-item {
            display: flex;
            gap: 1.1rem;
            width: 100%;
            padding: 1.05rem 1.2rem;
            background: linear-gradient(145deg, rgba(33, 150, 243, 0.07), rgba(25, 118, 210, 0.04));
            border: 1px solid rgba(33, 150, 243, 0.14);
            border-radius: 14px;
            color: inherit;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .thought-item:hover,
        .thought-item:focus-visible {
            transform: translateX(4px);
            border-color: rgba(33, 150, 243, 0.38);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            outline: none;
        }
        .thought-item-date {
            flex: 0 0 76px;
            padding-top: 0.2rem;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .thought-item-main {
            display: block;
            flex: 1 1 auto;
            min-width: 0;
        }
        .thought-item-title {
            display: block;
            margin: 0 0 0.4rem;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.45;
            color: #ffffff;
        }
        .thought-item-summary {
            margin: 0 0 0.55rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 0.85rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.62);
        }
        .thought-item-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem;
        }
        .thought-item-tag {
            padding: 0.12rem 0.5rem;
            border-radius: 999px;
            background: rgba(33, 150, 243, 0.14);
            color: #64b5f6;
            font-size: 0.72rem;
        }
        .thought-item-time {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
        }
        .thought-item-arrow {
            align-self: center;
            color: rgba(100, 181, 246, 0.7);
            font-size: 1rem;
            transition: transform 0.25s ease;
        }
        .thought-item:hover .thought-item-arrow {
            transform: translateX(4px);
        }

        /* 详情视图 */
        .thought-detail[hidden] {
            display: none;
        }
        .thought-back {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            color: #64b5f6;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .thought-back:hover {
            background: rgba(33, 150, 243, 0.18);
            border-color: rgba(33, 150, 243, 0.4);
        }
        .thought-detail .thought-article {
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .thought-item {
                flex-direction: column;
                gap: 0.35rem;
                padding: 0.9rem 1rem;
            }
            .thought-item-date {
                flex: none;
                padding-top: 0;
            }
            .thought-item-arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <nav class="nav">
            <div class="nav-left">
                <a href="index.html" class="logo">XueXue</a>
            <div class="header-title">想到什么就写什么</div>
            </div>
            <div class="search-wrapper">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="搜索网站内容..." autocomplete="off">
                    <button class="search-clear" type="button" title="清除">✕</button>
                </div>
                <div class="search-results"></div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link"><span class="nav-icon">🏠</span>网站首页</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link"><span class="nav-icon">👤</span>关于本人</a>
                </li>
                <li class="nav-item">
                    <a href="creation.html" class="nav-link active"><span class="nav-icon">✍️</span>内容创作</a>
                </li>
                <li class="nav-item">
                    <a href="resources.html" class="nav-link"><span class="nav-icon">🛠️</span>服务中心</a>
                </li>
                <li class="nav-item">
                    <a href="site-info.html" class="nav-link"><span class="nav-icon">ℹ️</span>站点信息</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 随想内容 -->
        <div class="container">
            <h2>生活随笔</h2>
            <p>详细内容占位符 - 生活随笔内容...</p>
        </div>
      <!-- 感悟思考 -->
        <div class="container">
            <h2>感悟思考</h2>

            <div id="thoughtListView" class="thought-list"></div>

            <div id="thoughtDetailView" class="thought-detail" hidden>
                <button type="button" class="thought-back" id="thoughtBackBtn">← 返回列表</button>
                <div id="thoughtDetailBody"></div>
            </div>
        </div>

        <div class="container">
            <h2>心情日记</h2>
            <p>详细内容占位符 - 心情日记内容...</p>
        </div>

        <!-- 返回按钮 -->
        <div class="container" style="text-align: center;">
            <a href="creation.html" class="module-card" style="display: inline-block; width: auto; padding: 1rem 2rem;">
                ← 返回内容创作
            </a>
        </div>
    </main>

    <!-- 返回上一级按钮 -->
    <button id="backToParent" class="back-to-parent" onclick="goToParent('creation.html')" title="返回上一级">←</button>

    <!-- 返回顶部按钮 -->
    <button id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</button>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2026 薛大侠 - 用心记录生活</p>
    </footer>

    <script src="js/thoughts-data.js?v=20261026"></script>
    <script src="js/script.js?v=20261029c"></script>
    <script src="js/pjax.js?v=20260913b"></script>
    <script>
    (function () {
        function formatDate(iso) {
            var p = String(iso).split('-');
            return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
        }

        function readingTime(item) {
            var chars = item.content.join('').replace(/<[^>]+>/g, '').length;
            return Math.max(1, Math.round(chars / 400));
        }

        function renderList(listEl) {
            var items = (window.THOUGHTS || []).slice().sort(function (a, b) {
                return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);
            });
            listEl.innerHTML = items.map(function (item, i) {
                return '<button type="button" class="thought-item" data-index="' + i + '">'
                    + '<span class="thought-item-date">' + item.date + '</span>'
                    + '<span class="thought-item-main">'
                    + '<span class="thought-item-title">' + item.title + '</span>'
                    + '<span class="thought-item-summary">' + item.summary + '</span>'
                    + '<span class="thought-item-meta">'
                    + item.tags.map(function (t) { return '<span class="thought-item-tag">' + t + '</span>'; }).join('')
                    + '<span class="thought-item-time">阅读约 ' + readingTime(item) + ' 分钟</span>'
                    + '</span>'
                    + '</span>'
                    + '<span class="thought-item-arrow">→</span>'
                    + '</button>';
            }).join('');
            listEl.__items = items;
        }

        function renderDetail(item) {
            var body = document.getElementById('thoughtDetailBody');
            if (!body) return;
            body.innerHTML = '<article class="thought-article">'
                + '<div class="thought-article-header">'
                + '<h3 class="thought-article-title">' + item.title + '</h3>'
                + '<div class="thought-article-meta">'
                + '<span class="thought-article-date">📅 ' + formatDate(item.date) + '</span>'
                + item.tags.map(function (t) { return '<span class="thought-article-tag">' + t + '</span>'; }).join('')
                + '<span class="thought-article-date">阅读约 ' + readingTime(item) + ' 分钟</span>'
                + '</div>'
                + '</div>'
                + '<div class="thought-article-content">'
                + item.content.map(function (p) { return '<p>' + p + '</p>'; }).join('')
                + '</div>'
                + '</article>';
        }

        function showDetail(item) {
            renderDetail(item);
            document.getElementById('thoughtListView').hidden = true;
            document.getElementById('thoughtDetailView').hidden = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showList() {
            document.getElementById('thoughtDetailView').hidden = true;
            document.getElementById('thoughtListView').hidden = false;
        }

        function init() {
            var listEl = document.getElementById('thoughtListView');
            var detailEl = document.getElementById('thoughtDetailView');
            if (!listEl || !detailEl || !window.THOUGHTS) return;

            renderList(listEl);

            if (listEl.dataset.bound !== '1') {
                listEl.dataset.bound = '1';
                listEl.addEventListener('click', function (e) {
                    var btn = e.target.closest('.thought-item');
                    if (!btn || !listEl.__items) return;
                    var item = listEl.__items[Number(btn.dataset.index)];
                    if (item) showDetail(item);
                });
            }

            var backBtn = document.getElementById('thoughtBackBtn');
            if (backBtn && backBtn.dataset.bound !== '1') {
                backBtn.dataset.bound = '1';
                backBtn.addEventListener('click', showList);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
