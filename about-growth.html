        function initTimeline() {
            renderTimeline();
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = timelineData.map((item, index) => `
                <div class="timeline-item ${index % 2 === 0 ? 'timeline-item-left' : 'timeline-item-right'}">
                    <div class="timeline-content">
                        <div class="timeline-year">${item.year}</div>
                        <div class="timeline-icon" style="background: ${item.color}">${item.icon}</div>
                        <h3>${item.title}</h3>
                        <p class="timeline-subtitle">${item.subtitle}</p>
                        <div class="timeline-items">
                            ${item.items.map(i => `
                                <div class="timeline-item-tag">
                                    <span class="tag-type ${getTagClass(i.type)}">${getTagIcon(i.type)}</span>
                                    <span class="tag-text">${i.text}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getTagClass(type) {
            const classes = {
                '成就': 'tag-achievement',
                '感悟': 'tag-insight',
                '计划': 'tag-plan',
                '挑战': 'tag-challenge',
                '旅行': 'tag-travel',
                '学习': 'tag-learning',
                '生活': 'tag-life',
                '荣誉': 'tag-honor',
                '项目': 'tag-project',
                '成长': 'tag-growth',
                '入职': 'tag-career',
                '适应': 'tag-adapt',
                '目标': 'tag-goal',
                '实习': 'tag-intern',
                '收获': 'tag-harvest',
                '决定': 'tag-decision',
                '社团': 'tag-community',
                '竞赛': 'tag-competition',
                '高考': 'tag-exam',
                '选择': 'tag-choice',
                '梦想': 'tag-dream'
            };
            return classes[type] || 'tag-other';
        }

        function getTagIcon(type) {
            const icons = {
                '成就': '🏆',
                '感悟': '💭',
                '计划': '📋',
                '挑战': '⚡',
                '旅行': '✈️',
                '学习': '📚',
                '生活': '🏠',
                '荣誉': '🎖️',
                '项目': '💻',
                '成长': '🌱',
                '入职': '👔',
                '适应': '🔄',
                '目标': '🎯',
                '实习': '🎓',
                '收获': '🎁',
                '决定': '✅',
                '社团': '👥',
                '竞赛': '🏅',
                '高考': '📝',
                '选择': '🔍',
                '梦想': '🌟'
            };
            return icons[type] || '📌';
        }
