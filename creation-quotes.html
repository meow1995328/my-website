<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典语录 - 薛大侠</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .quotes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
        }
        
        .quote-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            padding: 2rem;
            border-left: 4px solid #e94560;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        
        .quote-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.3);
        }
        
        .quote-card::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 4rem;
            color: rgba(233, 69, 96, 0.3);
            font-family: Georgia, serif;
            line-height: 1;
        }
        
        .quote-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #e0e0e0;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }
        
        .quote-author {
            text-align: right;
            color: #00d4ff;
            font-weight: 500;
            font-style: italic;
        }
        
        .quote-category {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        /* 网络名言：蓝色配色 */
        .quote-category.cat-internet {
            background: rgba(0, 168, 255, 0.2);
            color: #4da3ff;
        }

        /* 网络名言卡片：左边框 + hover 阴影改为蓝色 */
        .quote-card.quote-cat-internet {
            border-left-color: #4da3ff;
        }
        .quote-card.quote-cat-internet:hover {
            box-shadow: 0 8px 30px rgba(77, 163, 255, 0.3);
        }
        .quote-card.quote-cat-internet::before {
            color: rgba(77, 163, 255, 0.3);
        }

        /* 长语录：单独占满一行 */
        .quote-card-wide {
            grid-column: 1 / -1;
        }
        .quote-card-wide .quote-content {
            font-size: 1rem;                                  /* 略小，避免过长 */
            line-height: 1.9;
        }

        .quote-date {
            display: block;
            text-align: right;
            color: #888;
            font-size: 0.78rem;
            margin-top: 0.4rem;
        }
        
        .quote-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 1rem 0;
        }
        
        .filter-btn {
            padding: 0.5rem 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #e94560;
            border-color: #e94560;
        }

        .filter-btn .filter-count {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 0.05rem 0.45rem;
            font-size: 0.72rem;
            min-width: 1.3rem;
            text-align: center;
        }

        .filter-btn:hover .filter-count,
        .filter-btn.active .filter-count {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.4.3/dist/fuse.min.js"></script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <nav class="nav">
            <div class="nav-left">
                <a href="index.html" class="logo">XueXue</a>
            <div class="header-title">经典语录</div>
            <div class="header-subtitle">记录值得铭记的智慧之言</div>
            </div>
            <div class="search-wrapper">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" placeholder="搜索网站内容..." autocomplete="off">
                    <button class="search-clear" type="button" title="清除">✕</button>
                </div>
                <div class="search-results"></div>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">关于我</a>
                </li>
                <li class="nav-item">
                    <a href="creation.html" class="nav-link active">内容创作</a>
                </li>
                <li class="nav-item">
                    <a href="resources.html" class="nav-link">服务中心</a>
                </li>
                <li class="nav-item">
                </li>
                <li class="nav-item">
                    <a href="site-info.html" class="nav-link">站点信息</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 分类筛选（含各类数量统计） -->
        <div class="container">
            <div class="quote-filters" id="quoteFilters">
                <button class="filter-btn active" data-category="all">全部</button>
                <button class="filter-btn" data-category="philosophy">哲理</button>
                <button class="filter-btn" data-category="celebrity">名人</button>
                <button class="filter-btn" data-category="personal">个人语录</button>
                <button class="filter-btn" data-category="internet">网络名言</button>
            </div>
        </div>
        
        <!-- 语录列表 -->
        <div class="container">
            <div class="quotes-grid" id="quotesGrid">
                <!-- 语录卡片将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <!-- 返回按钮 -->
        <div class="container" style="text-align: center;">
            <a href="creation.html" class="module-card" style="display: inline-block; width: auto; padding: 1rem 2rem;">
                ← 返回内容创作
            </a>
        </div>
    </main>

    <!-- 返回上一级按钮 -->
    <button id="backToParent" class="back-to-parent" onclick="goToParent('creation.html')" title="返回上一级">←</button>
    
    <!-- 返回顶部按钮 -->
    <button id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</button>
    
    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2026 薛大侠 - 用心记录生活</p>
    </footer>

    <script>(function() {

        // 经典语录数据
        const quotes = [
            {
                content: '水清则浅，水绿则深，水黑则渊，鳝大成蛇，蛇大成蟒，蟒大成蛟，蛟大成龙，龙大成王，王中王，火腿肠，一节更比六节强，三百年，九芝堂，治肾亏，不含糖，果冻，我选喜之郎！喜之郎，不一般，马可波罗是瓷砖，能贴墙，能贴地，大力才能出奇迹，奇迹衍大道，道生一，一生二，二生三，三生万物，万物生太极，太极生两仪，两仪生四舅，四舅生八崽，八崽爱喝奶，喝了这个奶，忘掉那个崽，旺仔牛奶！',
                author: 'XueXue',
                category: 'internet',
                date: '2026-08-31'
            },
            {
                content: '人不是老了才会死，而是随时都可能会死的。生命没有预告，随时可能散场，我们唯一能把握的就是鲜活的"现在"。请珍视时光，珍爱身体，大胆追逐所想，用心享受生活。（本条创意来自互联网）',
                author: 'XueXue',
                category: 'personal',
                date: '2026-08-28'
            },
            {
                content: '现在打工上班的人都不叫"社畜"了，应该叫"畜牲"。之前好歹还在“社会”里混，现在光顾着干活，活得像头纯纯的牲口。（本条创意来自小方）',
                author: 'XueXue',
                category: 'personal',
                date: '2026-08-24'
            },
            {
                content: '你所浪费的今天，是昨天死去的人奢望的明天。',
                author: '佚名',
                category: 'philosophy'
            },
            {
                content: '世界上只有一种真正的英雄主义，那就是在认清生活真相之后依然热爱生活。',
                author: '罗曼·罗兰',
                category: 'celebrity'
            },
            {
                content: '千里之行，始于足下。',
                author: '老子',
                category: 'philosophy'
            },
            {
                content: '人生如逆旅，我亦是行人。',
                author: '苏轼',
                category: 'philosophy'
            },
            {
                content: '落红不是无情物，化作春泥更护花。',
                author: '龚自珍',
                category: 'philosophy'
            },
            {
                content: '不识庐山真面目，只缘身在此山中。',
                author: '苏轼',
                category: 'philosophy'
            },
            {
                content: '问渠那得清如许？为有源头活水来。',
                author: '朱熹',
                category: 'philosophy'
            }
        ];

        // 分类名称映射
        const categoryNames = {
            philosophy: '哲理',
            celebrity: '名人',
            personal: '个人语录',
            internet: '网络名言'
        };
        
        // 渲染语录
        function renderQuotes(category = 'all') {
            const grid = document.getElementById('quotesGrid');
            const filtered = category === 'all'
                ? quotes
                : quotes.filter(q => q.category === category);

            grid.innerHTML = filtered.map(quote => {
                // 长语录（> 80 字）单独占一行，避免文字挤压
                const isWide = quote.content.length > 80;
                const wideClass = isWide ? ' quote-card-wide' : '';
                // 按分类加修饰类，用于配色
                const catClass = ` quote-cat-${quote.category}`;
                return `
                <div class="quote-card${wideClass}${catClass}">
                    <span class="quote-category cat-${quote.category}">${categoryNames[quote.category]}</span>
                    <p class="quote-content">${quote.content}</p>
                    <p class="quote-author">— ${quote.author}</p>
                    ${quote.date ? `<span class="quote-date">${quote.date}</span>` : ''}
                </div>
                `;
            }).join('');
        }
        
        // 筛选按钮事件
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderQuotes(btn.dataset.category);
            });
        });

        // 标签数量统计徽章
        function countByCategory(cat) {
            return cat === 'all' ? quotes.length : quotes.filter(q => q.category === cat).length;
        }
        document.querySelectorAll('#quoteFilters .filter-btn').forEach(btn => {
            const count = countByCategory(btn.dataset.category);
            const badge = document.createElement('span');
            badge.className = 'filter-count';
            badge.textContent = count;
            btn.appendChild(badge);
        });

        // 初始渲染
        renderQuotes();
})();</script>
    <script src="js/script.js?v=20260913b"></script>
    <script src="js/pjax.js?v=20260913b"></script>
</body>
</html>
